<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bublinový festival — Domluvte se s nemluvňaty</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-v3.css?v=4">
    <style>
        .festival-page {
            min-height: 100vh;
            background: #29b5e8;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 80px 40px 60px;
            overflow: hidden;
            gap: 40px;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(
                ellipse at 30% 28%,
                rgba(255,255,255,0.75) 0%,
                rgba(255,255,255,0.18) 35%,
                rgba(200,240,255,0.06) 65%,
                transparent 100%
            );
            border: 1.5px solid rgba(255,255,255,0.55);
            box-shadow:
                inset 0 0 20px rgba(255,255,255,0.15),
                0 0 6px rgba(255,255,255,0.2);
            pointer-events: none;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 15%;
            width: 28%;
            height: 18%;
            background: rgba(255,255,255,0.55);
            border-radius: 50%;
            filter: blur(4px);
        }

        .bubble::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                rgba(255,120,120,0.22),
                rgba(255,200,80,0.18),
                rgba(120,255,180,0.15),
                rgba(100,200,255,0.18),
                rgba(180,120,255,0.22),
                rgba(255,120,120,0.22)
            );
        }

        .festival-title {
            font-family: 'Bangers', cursive;
            font-size: clamp(72px, 18vw, 210px);
            color: #f5a20a;
            text-align: center;
            line-height: 0.88;
            letter-spacing: 0.04em;
            position: relative;
            z-index: 10;
            text-shadow:
                3px 3px 0 rgba(180, 90, 0, 0.35),
                0 0 40px rgba(255,180,0,0.2);
        }

        .festival-bottom {
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.72);
            color: #fff;
            padding: 22px 36px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: clamp(15px, 2.2vw, 22px);
            font-weight: 800;
            line-height: 1.55;
            width: 100%;
            max-width: 700px;
        }

        .festival-actions {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        @media (max-width: 768px) {
            .festival-page {
                justify-content: center;
                padding: 70px 20px 40px;
                gap: 20px;
                min-height: 100vh;
            }
            .festival-title {
                font-size: clamp(56px, 20vw, 80px);
                margin-top: -80px;
            }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul class="nav-menu">
            <li><a href="index.html">Hlavní stránka</a></li>
        </ul>
    </nav>

    <main class="festival-page">

        <!-- Bubliny -->
        <div class="bubble" style="width:240px;height:240px;top:-50px;left:-50px;"></div>
        <div class="bubble" style="width:310px;height:310px;top:-80px;left:28%;"></div>
        <div class="bubble" style="width:200px;height:200px;top:-30px;right:-30px;"></div>
        <div class="bubble" style="width:130px;height:130px;top:160px;right:20px;"></div>
        <div class="bubble" style="width:110px;height:110px;top:130px;left:50px;"></div>
        <div class="bubble" style="width:65px;height:65px;top:300px;left:15px;"></div>
        <div class="bubble" style="width:45px;height:45px;top:220px;left:210px;"></div>
        <div class="bubble" style="width:35px;height:35px;top:370px;right:70px;"></div>
        <div class="bubble" style="width:55px;height:55px;top:42%;left:8%;"></div>
        <div class="bubble" style="width:90px;height:90px;top:47%;right:25px;"></div>
        <div class="bubble" style="width:270px;height:270px;bottom:100px;left:-60px;"></div>
        <div class="bubble" style="width:220px;height:220px;bottom:60px;right:-50px;"></div>
        <div class="bubble" style="width:330px;height:330px;bottom:-100px;left:32%;"></div>
        <div class="bubble" style="width:85px;height:85px;bottom:220px;right:110px;"></div>
        <div class="bubble" style="width:50px;height:50px;bottom:310px;left:170px;"></div>
        <div class="bubble" style="width:40px;height:40px;bottom:180px;left:240px;"></div>

        <!-- Nadpis -->
        <div class="festival-title">HLEDÁME<br>BUBLINÁŘE</div>

        <!-- Spodní text + tlačítko -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:10;width:100%;">
            <div class="festival-bottom">
                Máte rádi bubliny? My také! Více info<br>
                hledej zde: FB Domluvte se s nemluvňaty
            </div>
            <div class="festival-actions">
                <a class="btn-primary" href="index.html">Zpět na hlavní stránku</a>
            </div>
        </div>

    </main>
</body>
</html>
